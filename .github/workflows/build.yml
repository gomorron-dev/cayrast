name: Build

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # Cayrast is a Windows application and targets net10.0-windows; it cannot be
    # built or tested anywhere else.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Sourced from global.json so CI and local machines can never disagree
          # about the SDK version.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/shell/package-lock.json

      - name: Install frontend dependencies
        # `npm ci` rather than `npm install`, deliberately. It refuses to proceed when
        # package.json and the lockfile disagree, which is exactly how the TypeScript
        # 7 / svelte-check peer conflict was caught — `npm install` had silently
        # resolved around it and produced a lockfile that could not be reinstalled.
        run: npm ci
        working-directory: ui/shell

      - name: Type-check the frontend
        # svelte-check is the only thing that type-checks .svelte files; Vite happily
        # builds code that does not type-check, because esbuild strips types without
        # verifying them.
        run: npm run check
        working-directory: ui/shell

      - name: Build the frontend
        # Built before the .NET build, which copies its output into the launcher.
        # Without this the application starts with no interface, and the csproj emits a
        # warning rather than failing — so CI has to do it explicitly.
        run: npm run build
        working-directory: ui/shell

      - name: Restore
        run: dotnet restore Cayrast.slnx

      - name: Build
        # No --no-restore ambiguity and no relaxed warnings: CI builds with
        # warnings-as-errors on, which is the whole point of the policy.
        run: dotnet build Cayrast.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Cayrast.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        # Test results are most valuable precisely when the run failed.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Publish shell
        run: dotnet publish src/Cayrast.Shell/Cayrast.Shell.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: cayrast-win-x64
          path: artifacts/publish
          retention-days: 14
