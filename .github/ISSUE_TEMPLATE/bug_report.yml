name: Bug report
description: Something in Cayrast does not work as expected
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this.

        **Found a security vulnerability?** Please close this and report it privately
        instead — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: The launcher stops responding to Alt+Space after the screen locks.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Exact steps, from a clean start. This is the single most useful part of a bug
        report — a bug that can be reproduced is usually most of the way to fixed.
      placeholder: |
        1. Launch Cayrast
        2. Lock the screen with Win+L
        3. Sign back in
        4. Press Alt+Space — nothing happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: The launcher window appears, as it does before locking.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cayrast version
      description: Found in Settings → About, or the commit hash if you built from source.
      placeholder: 0.1.0-alpha (or commit a1b2c3d)
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Run `winver`, or copy from Settings → System → About."
      placeholder: Windows 11 24H2 (build 26100.2314)
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Relevant setup
      description: |
        Only if it might matter — multiple monitors, mixed DPI scaling, which modules
        are enabled, a custom theme, or a non-default hotkey.
      placeholder: Two monitors at 150% and 100% scaling; Clipboard and QR modules enabled.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        From `%LOCALAPPDATA%\Cayrast\Logs`. Please skim before pasting — logs can
        contain file paths and window titles you may not want public.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not already been reported
          required: true
        - label: I am on the latest version, or explained above why I cannot be
          required: true
