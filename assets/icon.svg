<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cayrast">
  <title>Cayrast</title>

  <!--
    The Cayrast mark: a command prompt reduced to its two essential strokes, a
    chevron and a caret line, set in a rounded panel.

    Deliberately abstract rather than illustrative. The shape reads at 16px in a
    system tray and at 512px on a store page, and the accent-to-shadow gradient
    gives it depth without depending on any single background colour — it sits
    correctly on both light and dark GitHub themes.
  -->

  <defs>
    <linearGradient id="cayrast-panel" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d947f" />
      <stop offset="1" stop-color="#6f685a" />
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="24" fill="url(#cayrast-panel)" />

  <!-- The chevron and caret are knocked out in near-white rather than pure white,
       which keeps them from vibrating against the warm accent. -->
  <g stroke="#faf9f7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M30 34 L45 48 L30 62" />
    <path d="M53 62 L68 62" />
  </g>
</svg>
